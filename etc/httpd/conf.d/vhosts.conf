<VirtualHost *>
    ServerName pullrequest.hope.nyc.ny.us
    DocumentRoot /var/flowlogix/html/pullrequest_hope
</VirtualHost>

<VirtualHost *>
    ServerName hope.nyc.ny.us
    ServerAlias *.hope.nyc.ny.us
    DocumentRoot /var/flowlogix/html/hope
</VirtualHost>

## Flow Logix

<VirtualHost *>
    ServerName docs.flowlogix.com
    DocumentRoot /var/flowlogix/html/docs
</VirtualHost>

<VirtualHost *>
    ServerName javadoc.flowlogix.com
    DocumentRoot /var/flowlogix/html/javadoc
</VirtualHost>

<VirtualHost *>
    ServerName pullrequest.flowlogix.com
    DocumentRoot /var/flowlogix/html/pullrequest_flowlogix
</VirtualHost>

<VirtualHost *>
    ServerName download.flowlogix.com
    ServerAlias dl.flowlogix.com
    DocumentRoot /var/flowlogix/downloads

    # Short addresses for the package repositories in releases/<tool>/ (first match wins)
    Alias /flowlogix.asc /var/flowlogix/downloads/releases/flowlogix.asc
    AliasMatch "^/apt/([^/]+)(/.*)?$" "/var/flowlogix/downloads/releases/$1/apt$2"
    AliasMatch "^/dnf/([^/]+)\.repo$" "/var/flowlogix/downloads/releases/$1/dnf/$1.repo"
    AliasMatch "^/dnf/([^/]+)(/.*)?$" "/var/flowlogix/downloads/releases/$1/dnf$2"
</VirtualHost>

<VirtualHost *>
    ServerName flowlogix.com
    ServerAlias *.flowlogix.com
    DocumentRoot /var/flowlogix/html/flowlogix
</VirtualHost>
